AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - data/**/*
    - reports/**/*
    - vendor/**/*

Style/Documentation:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - spec/**/*

# Reports take their collaborators as keyword arguments so they can be
# driven from fixtures in specs; that legitimately exceeds five.
Metrics/ParameterLists:
  CountKeywordArgs: false

Layout/LineLength:
  Max: 140
